[project]
name = "sim"
version = "0.1.0"
description = "P2 · mundo + injects por RCON."
requires-python = "==3.12.*"
dependencies = [
    "contracts",
    "mcrcon>=0.7",
    "pyyaml>=6",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim"]
