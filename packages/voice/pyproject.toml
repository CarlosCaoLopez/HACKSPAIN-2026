[project]
name = "voice"
version = "0.1.0"
description = "P3 · telefonía: HappyRobot saliente, humalike entrante."
requires-python = "==3.12.*"
dependencies = [
    "contracts",
    "fastapi>=0.115",
    "httpx>=0.27",
    "fenic>=0.1",
    "tqdm>=4",
    "typesafe-sdk>=0.7",
    "pyyaml>=6",
    "anthropic>=0.40,<1",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice"]
