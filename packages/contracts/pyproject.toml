[project]
name = "contracts"
version = "0.1.0"
description = "Los contratos. De nadie: se cambian con los cuatro delante."
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
