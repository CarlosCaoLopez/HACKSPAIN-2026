[project]
name = "journal"
version = "0.1.0"
description = "P1 · writer, replay, score. Append-only."
requires-python = "==3.12.*"
dependencies = [
    "contracts",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal"]
