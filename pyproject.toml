[project]
name = "vela"
version = "0.1.0"
description = "Agente de crisis · HackSpain 2026 · reto HappyRobot"
# fenic declara Requires-Python >=3.10,<3.13. No 3.13.
requires-python = "==3.12.*"
dependencies = [
    "contracts",
    "sim",
    "core",
    "voice",
    "journal",
    "gateway",
]

[dependency-groups]
# httpx lo necesita `fastapi.testclient`, que es con lo que se prueba el gateway
# (tests/test_gateway_ws.py). Declarado y no heredado de otra dependencia.
dev = ["mypy>=1.11", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/gateway"]

[tool.uv.sources]
contracts = { workspace = true }
sim = { workspace = true }
core = { workspace = true }
voice = { workspace = true }
journal = { workspace = true }
gateway = { workspace = true }

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `contracts` es lo único implementado: aquí sí se aprieta.
module = "contracts.*"
disallow_untyped_defs = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py312"
# ruff format reescribe los bloques de código de los .md: docs/ es la fuente de
# verdad del diseño y no se toca.
extend-exclude = ["docs"]

[tool.ruff.lint.isort]
known-first-party = ["contracts", "sim", "core", "voice", "journal", "gateway"]
