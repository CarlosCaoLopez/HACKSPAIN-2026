[project]
name = "gateway"
version = "0.1.0"
description = "P4 · monta todo en un solo proceso FastAPI."
requires-python = "==3.12.*"
dependencies = [
    "contracts",
    "sim",
    "core",
    "voice",
    "journal",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
]

[tool.uv.sources]
contracts = { workspace = true }
sim = { workspace = true }
core = { workspace = true }
voice = { workspace = true }
journal = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
